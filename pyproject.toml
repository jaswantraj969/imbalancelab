[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imbalancelab"
version = "0.1.0"
description = "Leakage-safe experimentation and auditing for imbalanced binary classification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "imbalanced-learn>=0.12,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "pyarrow>=15,<30",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "httpx>=0.27,<1",
    "httpx2>=2.16,<3",  # Starlette's TestClient prefers httpx2; plain httpx is deprecated there
]
ui = [
    "streamlit>=1.35,<2",
    "requests>=2.31,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
files = ["src", "frontend", "scripts"]
mypy_path = "frontend"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
